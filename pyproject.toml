[project]
name = "tlv-taiwan-flight-agent"
version = "1.0.0"
description = "Autonomous daily real-fare flight price agent for TLV <-> Taiwan (Oct 2027)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "requests>=2.31.0",
    "fast-flights>=3.1.0",
    "selectolax>=0.3.21",
    "protobuf>=5.28.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0.0"]
